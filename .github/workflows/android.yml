name: Flutter_Android

on:
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup JAVA 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.MY_KEY_ALIAS }}" | base64 --decode > android/app/my-key-alias.jks

      - name: Create key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: printf '%s\n' "$KEY_PROPERTIES" > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Verify version has a build number
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          echo "pubspec version: $version"
          case "$version" in
            *+[0-9]*) ;;
            *)
              echo "::error::pubspec.yaml version '$version' has no '+build-number' suffix."
              echo "::error::Android versionCode would silently fall back to 1 and the store will reject the upgrade."
              exit 1
              ;;
          esac

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Show resolved version
        run: cat android/local.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/app/outputs/flutter-apk/*-release.apk
